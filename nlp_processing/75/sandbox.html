<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Ticket sandbox</title>
<style>
  body { margin: 0; background: #eef2f7; color: #172337; font: 18px/24px system-ui, sans-serif; }
  main { position: absolute; top: 32px; left: 40px; width: 380px; padding: 24px;
         background: #fff; border-radius: 12px; }
  main.shifted { left: 460px; }
  h1 { margin: 0 0 12px; font-size: 28px; line-height: 34px; }
  p { margin: 0 0 16px; }
  label { display: block; }
  input, button { box-sizing: border-box; height: 40px; border-radius: 6px;
                  padding: 0 10px; font: inherit; }
  input { width: 100%; margin: 6px 0 12px; border: 1px solid #64748b; }
  button { background: #2450a6; color: #fff; border: 0; cursor: pointer; }
  output { display: block; margin-top: 18px; font-weight: 600; }
</style>
<main>
  <h1>Ticket sandbox</h1>
  <p>Submit a demo ticket</p>
  <form>
    <label for="ticket">Ticket ID</label>
    <input id="ticket" name="ticket" pattern="DEMO-[0-9]{3}" placeholder="DEMO-000" required>
    <button type="submit">Submit</button>
  </form>
  <output id="result" role="status">Waiting for a ticket</output>
</main>
<script>
  if (new URLSearchParams(location.search).get("layout") === "shifted") {
    document.querySelector("main").classList.add("shifted");
  }
  document.querySelector("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const ticket = new FormData(event.currentTarget).get("ticket");
    document.querySelector("#result").textContent = `Saved: ${ticket}`;
  });
</script>
</html>
